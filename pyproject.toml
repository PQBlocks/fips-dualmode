[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-fips-dualmode"
version = "0.1.0"
description = "Dual-mode cryptographic abstraction switching between FIPS 140-3 classical crypto (ECDH/AES-GCM) and post-quantum crypto (ML-KEM/ML-DSA)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "pqc", "fips-140-3", "dual-mode", "ml-kem", "ml-dsa", "ecdh", "aes-gcm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["cryptography", "liboqs-python"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/PQBlocks/fips-dualmode"
Documentation = "https://github.com/PQBlocks/fips-dualmode#readme"
Source = "https://github.com/PQBlocks/fips-dualmode"
Changelog = "https://github.com/PQBlocks/fips-dualmode/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/fips-dualmode/issues"
Security = "https://github.com/PQBlocks/fips-dualmode/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.csv", "*.yaml", "*.yml", "*.toml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
